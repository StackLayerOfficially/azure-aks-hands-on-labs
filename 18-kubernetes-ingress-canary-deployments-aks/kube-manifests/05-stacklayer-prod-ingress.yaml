# Purpose: Primary Production Ingress routing 100% baseline traffic to v1 (Genesis Core)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stacklayer-prod-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: web.stacklayer.cyou
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stacklayer-prod-v1-service
                port:
                  number: 80
