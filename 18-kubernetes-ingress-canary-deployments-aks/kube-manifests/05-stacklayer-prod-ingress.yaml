apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stacklayer-prod-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - web.stacklayer.cyou
      secretName: stacklayer-web-tls-secret
  rules:
    - host: web.stacklayer.cyou
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stacklayer-prod-v1-service
                port:
                  number: 80