# Purpose: Internal ClusterIP Service targeting Production (v1) Pods exclusively
apiVersion: v1
kind: Service
metadata:
  name: stacklayer-prod-v1-service
  labels:
    app: stacklayer-prod
    version: v1
spec:
  type: ClusterIP
  selector:
    app: stacklayer-prod
    version: v1
  ports:
    - name: http
      port: 80
      targetPort: 80