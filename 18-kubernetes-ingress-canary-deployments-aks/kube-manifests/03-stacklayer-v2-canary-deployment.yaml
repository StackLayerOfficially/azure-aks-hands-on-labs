# Purpose: Deploys Canary Candidate Tier — Stack Layer Velocity Edition (v2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stacklayer-canary-v2-deployment
  labels:
    app: stacklayer-canary
    version: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stacklayer-canary
      version: v2
  template:
    metadata:
      labels:
        app: stacklayer-canary
        version: v2
    spec:
      containers:
        - name: stacklayer-canary-nginx
          image: stacklayer/kubernetes:nginx-v2
          ports:
            - containerPort: 80