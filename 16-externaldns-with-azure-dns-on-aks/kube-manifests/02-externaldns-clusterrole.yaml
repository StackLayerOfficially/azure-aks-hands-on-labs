# Purpose: Read-only Kubernetes discovery RBAC permissions (includes EndpointSlices for v0.18.0+)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources:
      - services
      - pods
      - nodes
    verbs:
      - get
      - watch
      - list
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - watch
      - list
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs:
      - get
      - watch
      - list
  - apiGroups: ["externaldns.k8s.io"]
    resources:
      - dnsendpoints
      - dnsendpoints/status
    verbs:
      - "*"
