# Purpose: Standalone Azure LoadBalancer Service annotated for automatic direct.stacklayer.cyou DNS
apiVersion: v1
kind: Service
metadata:
  name: stacklayer-direct-v5-lb-service
  annotations:
    external-dns.alpha.kubernetes.io/hostname: direct.stacklayer.cyou
spec:
  type: LoadBalancer
  selector:
    app: stacklayer-direct-v5
  ports:
    - name: http
      port: 80
      targetPort: 80
