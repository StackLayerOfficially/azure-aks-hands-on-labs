apiVersion: apps/v1
kind: Deployment
metadata:
  name: stacklayer-backend-deployment
  labels:
    app: stacklayer-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stacklayer-backend
  template:
    metadata:
      labels:
        app: stacklayer-backend
    spec:
      containers:
      - name: backend-api
        image: stacklayer/kubernetes:nginx-v1
        ports:
        - containerPort: 80
