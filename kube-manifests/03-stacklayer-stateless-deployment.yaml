apiVersion: apps/v1
kind: Deployment
metadata:
  name: stacklayer-web-deployment
  labels:
    app: stacklayer-stateless-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stacklayer-stateless-web
  template:
    metadata:
      labels:
        app: stacklayer-stateless-web
    spec:
      containers:
        - name: nginx-stateless
          image: stacklayer/kubernetes:nginx-v1
          ports:
            - containerPort: 80
