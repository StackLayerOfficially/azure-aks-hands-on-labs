# Purpose: Deploys App 2 — Stack Layer Velocity Edition (v2) HTTPS backend pods
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stacklayer-app2-v2-deployment
  labels:
    app: stacklayer-app2-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stacklayer-app2-v2
  template:
    metadata:
      labels:
        app: stacklayer-app2-v2
    spec:
      containers:
        - name: stacklayer-app2-nginx
          image: stacklayer/kubernetes:nginx-v2
          ports:
            - containerPort: 80
