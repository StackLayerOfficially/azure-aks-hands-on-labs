# Purpose: Internal ClusterIP Service routing TLS-terminated traffic to App 2 pods
apiVersion: v1
kind: Service
metadata:
  name: stacklayer-app2-v2-clusterip-service
  labels:
    app: stacklayer-app2-v2
spec:
  type: ClusterIP
  selector:
    app: stacklayer-app2-v2
  ports:
    - name: http
      port: 80
      targetPort: 80
