apiVersion: apps/v1
kind: Deployment
metadata:
  name: stacklayer-app2-deployment
  labels:
    app: stacklayer-app2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stacklayer-app2
  template:
    metadata:
      labels:
        app: stacklayer-app2
    spec:
      containers:
        - name: app2-container
          image: stacklayer/kubernetes:nginx-v2
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
