# Purpose: Canary Ingress routing 20% weighted traffic to v2 (Velocity Edition)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stacklayer-beta-ingress
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "0"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Release-Stage"
    nginx.ingress.kubernetes.io/canary-by-header-value: "beta"
    nginx.ingress.kubernetes.io/canary-by-cookie: "stacklayer-cohort"
spec:
  ingressClassName: nginx
  rules:
    - host: web.stacklayer.cyou
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stacklayer-beta-v3-service
                port:
                  number: 80