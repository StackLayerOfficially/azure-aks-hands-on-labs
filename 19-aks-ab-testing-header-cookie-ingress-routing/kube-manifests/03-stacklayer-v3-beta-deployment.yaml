# Purpose: Deploys Canary Candidate Tier — Stack Layer Velocity Edition (v2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stacklayer-beta-v3-deployment
  labels:
    app: stacklayer-canary
    version: v3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stacklayer-beta
      version: v3
  template:
    metadata:
      labels:
        app: stacklayer-beta
        version: v3
    spec:
      containers:
        - name: stacklayer-beta-nginx
          image: stacklayer/kubernetes:nginx-v3
          ports:
            - containerPort: 80