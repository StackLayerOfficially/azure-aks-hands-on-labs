apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stacklayer-domain-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: app1.stacklayer.cyou
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stacklayer-app1-clusterip-service
                port:
                  number: 80
    - host: app2.stacklayer.cyou
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stacklayer-app2-clusterip-service
                port:
                  number: 80
    - host: stacklayer.cyou
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stacklayer-app1-clusterip-service
                port:
                  number: 80
