apiVersion: apps/v1
kind: Deployment
metadata:
  name: stacklayer-app2-deployment
  labels:
    app: stacklayer-app2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stacklayer-app2
  template:
    metadata:
      labels:
        app: stacklayer-app2
    spec:
      containers:
        - name: stacklayer-app2-nginx
          image: stacklayer/kubernetes:nginx-v4
          ports:
            - containerPort: 80
